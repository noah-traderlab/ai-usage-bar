name: macOS application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyInstaller==6.22.0
      - run: python -m unittest test_secure_writes -v && python selftest.py
        working-directory: mac
      - run: python mac/build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ matrix.arch }}
          path: |
            dist/macos-${{ matrix.arch }}/*.dmg
            dist/macos-${{ matrix.arch }}/SHA256SUMS.txt
          if-no-files-found: error
