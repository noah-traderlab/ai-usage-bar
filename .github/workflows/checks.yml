name: Source checks
on: [push, pull_request]
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_secure_writes -v
        working-directory: mac
      - run: python selftest.py
        working-directory: mac
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./build.ps1
        shell: powershell
      - run: ./build/tests.exe --unit
        shell: powershell
      - run: ./build/tests.exe --team
        shell: powershell
      - run: python mac/crosstest.py
